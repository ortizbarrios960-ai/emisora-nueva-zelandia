<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📻 Solicitudes en vivo</title><style>body{margin:0;background:#080b1b;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:#11172d;border:1px solid #2a3456;border-radius:16px;padding:18px;margin:12px 0}.meta{color:#aeb6d5;font-size:13px}button{border:0;border-radius:9px;padding:10px 13px;margin:8px 5px 0 0;font-weight:800}.ok{background:#22c55e}.no{background:#ef4444;color:#fff}.del{background:#334155;color:#fff}</style></head><body><div class="wrap"><h1>📻 Solicitudes en vivo</h1><div id="app"></div></div><script>const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function render(){const a=await fetch('/api/requests').then(r=>r.json()),b=document.querySelector('#app');b.innerHTML=a.length?'':'<div class=card>No hay solicitudes.</div>';a.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>🎵 ${esc(x.song)}</b><div class=meta>👤 ${esc(x.name||'Anónimo')} · ${new Date(x.createdAt).toLocaleString()} · ${esc(x.status)}</div>{x.dedication?`<div class=meta>💌 ${esc(x.dedication)}</div>`:''}<button class=ok onclick="st('${x.id}','aprobada')">Aprobar</button><button class=no onclick="st('${x.id}','rechazada')">Rechazar</button><button class=del onclick="rm('${x.id}')">Eliminar</button>`;b.appendChild(d)})}async function st(id,status){await fetch('/api/requests/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}async function rm(id){await fetch('/api/requests/'+id,{method:'DELETE'});render()}render();setInterval(render,4000)</script></body></html>
