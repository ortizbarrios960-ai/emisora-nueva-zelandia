
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel · RADIO MILENIAL</title>
<style>
body{margin:0;background:#080b1b;color:#fff;font-family:Arial,sans-serif;padding:20px}
.wrap{max-width:1000px;margin:auto}
.card{background:#11172d;border:1px solid #2a3456;border-radius:16px;padding:18px;margin:12px 0}
.meta{color:#aeb6d5;font-size:13px;margin-top:8px;overflow-wrap:anywhere}
button{border:0;border-radius:9px;padding:10px 13px;margin:8px 5px 0 0;font-weight:800;cursor:pointer}
.ok{background:#22c55e}
.no{background:#ef4444;color:white}
.del{background:#334155;color:white}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ RADIO MILENIAL · Panel de moderación</h1>
  <p>Panel local de demostración. Para gestionar las solicitudes de Supabase, usa <b>/admin-server.html</b>.</p>
  <div id="list"></div>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

function render() {
  const requests = JSON.parse(localStorage.getItem("nz_requests") || "[]");
  const list = document.querySelector("#list");
  list.innerHTML = requests.length ? "" : '<div class="card">No hay solicitudes locales.</div>';

  requests.slice().reverse().forEach((x, reverseIndex) => {
    const index = requests.length - 1 - reverseIndex;
    const card = document.createElement("div");
    card.className = "card";

    const dateValue = x.created_at || x.createdAt;
    const dateText = dateValue ? new Date(dateValue).toLocaleString() : "Fecha no disponible";

    card.innerHTML = `
      <b>🎵 ${esc(x.song)}</b>
      <div class="meta">🎤 Artista: ${esc(x.artist || "No indicado")}</div>
      <div class="meta">👤 ${esc(x.name || "Anónimo")}</div>
      ${x.dedication ? `<div class="meta">💌 ${esc(x.dedication)}</div>` : ""}
      <div class="meta">🕐 ${esc(dateText)} · Estado: ${esc(x.status || "pendiente")}</div>
      <button class="ok">Aprobar</button>
      <button class="no">Rechazar</button>
      <button class="del">Eliminar</button>
    `;

    card.querySelector(".ok").addEventListener("click", () => setStatus(index, "aprobada"));
    card.querySelector(".no").addEventListener("click", () => setStatus(index, "rechazada"));
    card.querySelector(".del").addEventListener("click", () => removeLocal(index));
    list.appendChild(card);
  });
}

function setStatus(index, status) {
  const requests = JSON.parse(localStorage.getItem("nz_requests") || "[]");
  if (!requests[index]) return;
  requests[index].status = status;
  localStorage.setItem("nz_requests", JSON.stringify(requests));
  render();
}

function removeLocal(index) {
  const requests = JSON.parse(localStorage.getItem("nz_requests") || "[]");
  if (!requests[index]) return;
  requests.splice(index, 1);
  localStorage.setItem("nz_requests", JSON.stringify(requests));
  render();
}

render();
</script>
</body>
</html>
