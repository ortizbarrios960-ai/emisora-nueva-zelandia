<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · Emisora Nueva Zelandia</title><style>body{margin:0;background:#080b1b;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:#11172d;border:1px solid #2a3456;border-radius:16px;padding:18px;margin:12px 0}.meta{color:#aeb6d5;font-size:13px}button{border:0;border-radius:9px;padding:10px 13px;margin:8px 5px 0 0;font-weight:800;cursor:pointer}.ok{background:#22c55e}.no{background:#ef4444;color:white}.del{background:#334155;color:white}</style></head><body><div class="wrap"><h1>🎙️ Panel de moderación</h1><p>Panel local de demostración. Con el backend activo, usa <b>/admin-server.html</b>.</p><div id="list"></div></div><script>const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(){const a=JSON.parse(localStorage.getItem('nz_requests')||'[]'),b=document.querySelector('#list');b.innerHTML=a.length?'':'<div class=card>No hay solicitudes.</div>';a.slice().reverse().forEach((x,r)=>{const i=a.length-1-r,d=document.createElement('div');d.className='card';d.innerHTML=`<b>🎵 ${esc(x.song)}</b><div class=meta>👤 ${esc(x.name||'Anónimo')} · ${new Date(x.createdAt).toLocaleString()} · Estado: ${esc(x.status||'pendiente')}</div><button class=ok onclick="st(${i},'aprobada')">Aprobar</button><button class=no onclick="st(${i},'rechazada')">Rechazar</button><button class=del onclick="del(${i})">Eliminar</button>`;b.appendChild(d)})}function st(i,s){const a=JSON.parse(localStorage.getItem('nz_requests')||'[]');a[i].status=s;localStorage.setItem('nz_requests',JSON.stringify(a));render()}function del(i){const a=JSON.parse(localStorage.getItem('nz_requests')||'[]');a.splice(i,1);localStorage.setItem('nz_requests',JSON.stringify(a));render()}render()</script></body></html>
